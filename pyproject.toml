[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "jev-guard"
dynamic = ["version"]
description = "Fast, cheap guardrails for LLM apps, powered by TypeSafe's Jev model."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Rudra" }]
keywords = ["llm", "guardrails", "jev", "typesafe-ai", "prompt-injection", "llm-security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    # 0.x SDK ships breaking changes between minors (0.6 and 0.7 both did) — pin the minor.
    "typesafe-sdk>=0.7.1,<0.8",
    "pydantic>=2.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
otel = ["opentelemetry-api>=1.25"]
# Offline backend: local transformer models (downloads ~1.5 GB of models on first use).
local = ["transformers>=4.44", "torch>=2.2", "sentencepiece>=0.2", "protobuf>=4"]
cli = ["typer>=0.12", "rich>=13", "jinja2>=3.1"]
langchain = ["langchain-core>=0.3"]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.0"]
all = ["jev-guard[otel,cli,langchain,anthropic,openai]"]
# MkDocs 2.0 drops plugin/theme support that mkdocs-material relies on.
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "hatch>=1.12",
    "types-PyYAML",
    "langchain-core>=0.3",  # needed to type-check and test the LangChain callback
    "typer>=0.12",
    "rich>=13",
    "jinja2>=3.1",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",  # InMemorySpanExporter for the telemetry tests
]

[project.scripts]
jev-guard = "jev_guard.cli:main"

[project.urls]
Homepage = "https://github.com/rudra72r/jev-guard"
Repository = "https://github.com/rudra72r/jev-guard"
Issues = "https://github.com/rudra72r/jev-guard/issues"

[tool.hatch.version]
path = "src/jev_guard/__init__.py"  # single source of truth for the version

[tool.hatch.build.targets.sdist]
exclude = [
    "/.github",
    "/.venv",
    "/benchmarks/.cache",
    "/notes",  # build history (spec, deviations, launch checklist) — not part of the package
]

[tool.hatch.build.targets.wheel]
packages = ["src/jev_guard"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ARG", "PL"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "ARG", "PLR0913", "PLR0917"]
# An SVG template: wrapping these lines would put newlines inside attribute values.
"scripts/make_demo.py" = ["E501"]
# Callback signatures are fixed by LangChain's BaseCallbackHandler interface.
"src/jev_guard/integrations/langchain_cb.py" = ["ARG002"]
"src/jev_guard/integrations/litellm_proxy.py" = ["ARG002"]  # LiteLLM hook signatures
"benchmarks/detectors.py" = ["ARG002"]  # every detector implements the same protocol
# Typer commands declare every CLI option as a parameter.
"src/jev_guard/_cli_app.py" = ["PLR0913", "PLR0917"]
# Golden samples are long natural-language strings; wrapping them hurts readability.
"scripts/build_golden_dataset.py" = ["E501"]
# The inline HTML report template has long lines by nature.
"src/jev_guard/eval/report.py" = ["E501"]
# Numbered file names are intentional; framework callbacks fix some signatures.
"examples/**" = ["PLR2004", "N999", "ARG002"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "benchmarks"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# torch/numpy ship stubs that need a newer Python than our floor; don't analyse them.
module = ["numpy", "numpy.*", "torch", "torch.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_errors = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
# LiteLLM is an optional runtime dependency of the proxy hook and isn't installed in CI.
module = [
    "litellm",
    "litellm.*",
    "anthropic",
    "anthropic.*",
    "llm_guard",
    "llm_guard.*",
    "transformers",
    "transformers.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
strict = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # so tests can import the top-level benchmarks package
asyncio_mode = "auto"
addopts = "--strict-markers"
markers = [
    "integration: calls the real Jev API; needs TYPESAFE_API_KEY and JEV_GUARD_ALLOW_LIVE=1",
]

[tool.coverage.run]
source = ["jev_guard"]
omit = ["*/jev_guard/integrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
