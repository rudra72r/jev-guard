<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320"
     role="img" aria-label="jev-guard — input and output guardrails for LLM apps, 70 to 500 milliseconds, about $0.00002 a check">
  <title>jev-guard</title>
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "Cascadia Mono", Consolas, "DejaVu Sans Mono", monospace; }
      .lab  { font-size: 10px; letter-spacing: 1.7px; fill: #8A8A80; }
    </style>
  </defs>

  <rect width="1280" height="320" fill="#FFFFFF"/>

  <!-- frame + registration ticks -->
  <rect x="24.5" y="24.5" width="1231" height="271" fill="none" stroke="#12120F" stroke-width="1"/>
  <g stroke="#12120F" stroke-width="1" fill="none">
    <path d="M24.5 44V24.5H44M1236 24.5h19.5V44M1255.5 276v19.5H1236M44 295.5H24.5V276"/>
  </g>

  <!-- margin labels -->
  <text class="mono lab" x="56" y="62">GUARDRAILS FOR LLM APPS</text>
  <text class="mono lab" x="1224" y="62" text-anchor="end">MIT · PYTHON 3.10+</text>
  <line x1="56" y1="76" x2="1224" y2="76" stroke="#E2E2DC" stroke-width="1"/>

  <!-- mark -->
  <g transform="translate(56 112)">
    <rect width="56" height="56" fill="#FFFFFF"/>
    <rect x=".75" y=".75" width="54.5" height="54.5" fill="none" stroke="#12120F" stroke-width="1.5"/>
    <rect x="10" y="14" width="30" height="5" fill="#C82828"/>
    <rect x="10" y="25.5" width="26" height="5" fill="#B07000"/>
    <rect x="10" y="37" width="11" height="5" fill="#12120F" opacity=".38"/>
    <line x1="32.5" y1="9" x2="32.5" y2="47" stroke="#12120F" stroke-width="1.5"/>
  </g>

  <!-- wordmark -->
  <text class="mono" x="132" y="146" font-size="46" font-weight="700" fill="#12120F"
        letter-spacing="-1.8">jev-guard</text>
  <text class="mono" x="134" y="176" font-size="13" fill="#5E5E56" letter-spacing=".2">
    Every input and output checked in 70–500 ms, for about $0.00002.
  </text>
  <text class="mono" x="134" y="198" font-size="13" fill="#5E5E56" letter-spacing=".2">
    Not a yes or a no — the question, the value, the threshold.
  </text>

  <text class="mono lab" x="56" y="266">github.com/rudra72r/jev-guard</text>

  <!-- readout -->
  <g transform="translate(700 0)">
    <text class="mono lab" x="0" y="112">QUESTION</text>
    <text class="mono lab" x="286" y="112" text-anchor="end">VALUE</text>
    <text class="mono lab" x="524" y="112" text-anchor="end">SEVERITY</text>
    <line x1="0" y1="122" x2="524" y2="122" stroke="#12120F" stroke-width="1"/>

    <!-- scale: x = 0 .. 300 maps 0.00 .. 1.00, bars start at 0 -->
    <g class="mono" font-size="12" fill="#12120F">

      <!-- is_prompt_injection 1.00, threshold 0.85 -->
      <text x="0" y="150">is_prompt_injection</text>
      <rect x="0" y="158" width="300" height="7" fill="#F0F0EB"/>
      <rect x="0" y="158" width="300" height="7" fill="#C82828"/>
      <line x1="255" y1="154" x2="255" y2="169" stroke="#12120F" stroke-width="1.5"/>
      <text x="286" y="150" text-anchor="end" font-weight="700">1.00</text>
      <text x="524" y="150" text-anchor="end" fill="#C82828" font-size="11" letter-spacing="1.2">CRITICAL</text>

      <!-- contains_pii 0.95, threshold 0.60 -->
      <text x="0" y="196">contains_pii</text>
      <rect x="0" y="204" width="300" height="7" fill="#F0F0EB"/>
      <rect x="0" y="204" width="285" height="7" fill="#B07000"/>
      <line x1="180" y1="200" x2="180" y2="215" stroke="#12120F" stroke-width="1.5"/>
      <text x="286" y="196" text-anchor="end" font-weight="700">0.95</text>
      <text x="524" y="196" text-anchor="end" fill="#B07000" font-size="11" letter-spacing="1.2">HIGH</text>

      <!-- intent 0.12, threshold 0.80 — under, so nothing fires -->
      <text x="0" y="242" fill="#5E5E56">intent</text>
      <rect x="0" y="250" width="300" height="7" fill="#F0F0EB"/>
      <rect x="0" y="250" width="36" height="7" fill="#12120F" opacity=".38"/>
      <line x1="240" y1="246" x2="240" y2="261" stroke="#12120F" stroke-width="1.5"/>
      <text x="286" y="242" text-anchor="end" fill="#5E5E56">0.12</text>
      <text x="524" y="242" text-anchor="end" fill="#8A8A80" font-size="11" letter-spacing="1.2">UNDER</text>
    </g>

    <!-- axis -->
    <line x1="0" y1="276" x2="300" y2="276" stroke="#C9C9C2" stroke-width="1"/>
    <g class="mono" font-size="9.5" fill="#8A8A80" letter-spacing=".6">
      <text x="0" y="290">0.00</text>
      <text x="150" y="290" text-anchor="middle">0.50</text>
      <text x="300" y="290" text-anchor="end">1.00</text>
    </g>
    <text class="mono" x="524" y="290" text-anchor="end" font-size="9.5" fill="#8A8A80"
          letter-spacing="1.2">│ = THRESHOLD</text>
  </g>
</svg>
