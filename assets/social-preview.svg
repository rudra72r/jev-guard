<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640"
     role="img" aria-label="jev-guard — open-source guardrails for LLM apps">
  <title>jev-guard</title>
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "Cascadia Mono", Consolas, "DejaVu Sans Mono", monospace; }
      .lab  { font-size: 11px; letter-spacing: 1.9px; fill: #8A8A80; }
    </style>
  </defs>

  <rect width="1280" height="640" fill="#FFFFFF"/>

  <rect x="28.5" y="28.5" width="1223" height="583" fill="none" stroke="#12120F" stroke-width="1"/>
  <g stroke="#12120F" stroke-width="1" fill="none">
    <path d="M28.5 52V28.5H52M1228 28.5h23.5V52M1251.5 588v23.5H1228M52 611.5H28.5V588"/>
  </g>

  <text class="mono lab" x="64" y="80">OPEN-SOURCE GUARDRAILS FOR LLM APPS</text>
  <text class="mono lab" x="1216" y="80" text-anchor="end">MIT · PYTHON 3.10+</text>
  <line x1="64" y1="96" x2="1216" y2="96" stroke="#E2E2DC" stroke-width="1"/>

  <!-- mark -->
  <g transform="translate(64 136)">
    <rect width="72" height="72" fill="#FFFFFF"/>
    <rect x=".75" y=".75" width="70.5" height="70.5" fill="none" stroke="#12120F" stroke-width="1.5"/>
    <rect x="13" y="18" width="39" height="6" fill="#C82828"/>
    <rect x="13" y="33" width="33" height="6" fill="#B07000"/>
    <rect x="13" y="48" width="14" height="6" fill="#12120F" opacity=".38"/>
    <line x1="42" y1="12" x2="42" y2="60" stroke="#12120F" stroke-width="1.5"/>
  </g>

  <text class="mono" x="160" y="186" font-size="58" font-weight="700" fill="#12120F"
        letter-spacing="-2.4">jev-guard</text>

  <!-- thesis -->
  <g class="mono" font-size="19" fill="#12120F">
    <text x="64" y="290">Every input and output checked in 70–500 ms,</text>
    <text x="64" y="322">for about $0.00002 a check.</text>
  </g>
  <g class="mono" font-size="15" fill="#5E5E56">
    <text x="64" y="366">Not a yes or a no — the question that fired, the</text>
    <text x="64" y="390">value it came back with, the threshold it crossed,</text>
    <text x="64" y="414">and how much that matters.</text>
  </g>

  <!-- measured strip -->
  <line x1="64" y1="470" x2="616" y2="470" stroke="#E2E2DC" stroke-width="1"/>
  <g class="mono">
    <g>
      <text x="64" y="512" font-size="30" font-weight="700" fill="#12120F">0.95</text>
      <text class="lab" x="64" y="534">F1, PROMPT INJECTION</text>
    </g>
    <g>
      <text x="270" y="512" font-size="30" font-weight="700" fill="#12120F">6</text>
      <text class="lab" x="270" y="534">POLICIES, PLAIN YAML</text>
    </g>
    <g>
      <text x="476" y="512" font-size="30" font-weight="700" fill="#12120F">0</text>
      <text class="lab" x="476" y="534">API KEYS TO TRY IT</text>
    </g>
  </g>

  <text class="mono" x="64" y="584" font-size="15" fill="#5E5E56">github.com/rudra72r/jev-guard</text>

  <!-- readout -->
  <g transform="translate(700 0)">
    <text class="mono lab" x="0" y="150">QUESTION</text>
    <text class="mono lab" x="516" y="150" text-anchor="end">SEVERITY</text>
    <line x1="0" y1="164" x2="516" y2="164" stroke="#12120F" stroke-width="1"/>

    <g class="mono" font-size="14" fill="#12120F">
      <!-- scale: 0 .. 380 maps 0.00 .. 1.00 -->
      <text x="0" y="200">is_prompt_injection</text>
      <text x="380" y="200" text-anchor="end" font-weight="700">1.00</text>
      <rect x="0" y="210" width="380" height="9" fill="#F0F0EB"/>
      <rect x="0" y="210" width="380" height="9" fill="#C82828"/>
      <line x1="323" y1="205" x2="323" y2="224" stroke="#12120F" stroke-width="1.5"/>
      <text x="516" y="200" text-anchor="end" fill="#C82828" font-size="12" letter-spacing="1.4">CRITICAL</text>

      <text x="0" y="266">contains_pii</text>
      <text x="380" y="266" text-anchor="end" font-weight="700">0.95</text>
      <rect x="0" y="276" width="380" height="9" fill="#F0F0EB"/>
      <rect x="0" y="276" width="361" height="9" fill="#B07000"/>
      <line x1="228" y1="271" x2="228" y2="290" stroke="#12120F" stroke-width="1.5"/>
      <text x="516" y="266" text-anchor="end" fill="#B07000" font-size="12" letter-spacing="1.4">HIGH</text>

      <text x="0" y="332" fill="#5E5E56">intent</text>
      <text x="380" y="332" text-anchor="end" fill="#5E5E56">0.12</text>
      <rect x="0" y="342" width="380" height="9" fill="#F0F0EB"/>
      <rect x="0" y="342" width="46" height="9" fill="#12120F" opacity=".38"/>
      <line x1="304" y1="337" x2="304" y2="356" stroke="#12120F" stroke-width="1.5"/>
      <text x="516" y="332" text-anchor="end" fill="#8A8A80" font-size="12" letter-spacing="1.4">UNDER</text>
    </g>

    <line x1="0" y1="392" x2="380" y2="392" stroke="#C9C9C2" stroke-width="1"/>
    <g class="mono" font-size="11" fill="#8A8A80" letter-spacing=".6">
      <text x="0" y="410">0.00</text>
      <text x="190" y="410" text-anchor="middle">0.50</text>
      <text x="380" y="410" text-anchor="end">1.00</text>
    </g>

    <text class="mono" x="516" y="410" text-anchor="end" font-size="11" fill="#8A8A80"
          letter-spacing="1.4">| = THRESHOLD</text>

    <line x1="0" y1="470" x2="516" y2="470" stroke="#E2E2DC" stroke-width="1"/>
    <text class="mono" x="0" y="512" font-size="15" fill="#5E5E56">Verdict:</text>
    <text class="mono" x="86" y="512" font-size="15" font-weight="700" fill="#C82828">BLOCK</text>
    <text class="mono" x="170" y="512" font-size="15" fill="#5E5E56">confidence 0.30</text>
    <text class="mono" x="0" y="540" font-size="13" fill="#8A8A80">measured offline, no API key</text>
  </g>
</svg>
