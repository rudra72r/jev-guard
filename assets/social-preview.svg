<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640"
     role="img" aria-label="jev-guard — guardrails for LLM apps">
  <title>jev-guard</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#100C1E"/>
      <stop offset=".5" stop-color="#0B0E14"/>
      <stop offset="1" stop-color="#090C12"/>
    </linearGradient>
    <radialGradient id="glow" cx=".1" cy="0" r=".8">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity=".38"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="1" cy="1" r=".65">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".16"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#FFFFFF" stroke-opacity=".03"/>
    </pattern>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A1B54"/>
      <stop offset="1" stop-color="#11131C"/>
    </linearGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "Cascadia Mono", Consolas, Menlo, monospace; }
    </style>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <rect width="1280" height="640" fill="url(#glow2)"/>

  <!-- mark -->
  <g transform="translate(88 78)">
    <rect width="104" height="104" rx="25" fill="url(#tile)"/>
    <rect x=".75" y=".75" width="102.5" height="102.5" rx="24.25" fill="none"
          stroke="#8B5CF6" stroke-opacity=".45"/>
    <rect x="24" y="28" width="56" height="9" rx="4.5" fill="#34D399"/>
    <rect x="24" y="47" width="37" height="9" rx="4.5" fill="#FBBF24"/>
    <rect x="24" y="66" width="18" height="9" rx="4.5" fill="#F87171"/>
  </g>

  <text class="sans" x="222" y="146" font-size="76" font-weight="700" fill="#F5F7FA"
        letter-spacing="-2">jev-guard</text>
  <text class="sans" x="226" y="192" font-size="22" fill="#9AA3B6" letter-spacing=".2">
    Open-source guardrails for LLM apps
  </text>

  <!-- headline claim -->
  <text class="sans" x="88" y="286" font-size="40" font-weight="600" fill="#E9ECF3"
        letter-spacing="-.5">Every input and output checked in 70–500 ms,</text>
  <text class="sans" x="88" y="338" font-size="40" font-weight="600" fill="#E9ECF3"
        letter-spacing="-.5">for about <tspan fill="#A78BFA">$0.00002</tspan> a check.</text>

  <!-- verdict card -->
  <g transform="translate(88 386)">
    <rect width="620" height="166" rx="14" fill="#0E121B" fill-opacity=".9" stroke="#262D3C"/>
    <g class="mono" font-size="16">
      <text x="24" y="42" fill="#6B7689">&gt;&gt;&gt; guard.check_input(user_message)</text>
      <text x="24" y="82" fill="#F87171" font-weight="700">BLOCK</text>
      <text x="108" y="82" fill="#8B94A7">confidence 0.30</text>
      <text x="24" y="118" fill="#C6CDDB">is_prompt_injection</text>
      <text x="268" y="118" fill="#E6E9EF">1.00 &gt; 0.85</text>
      <text x="400" y="118" fill="#F87171">critical</text>
      <text x="24" y="146" fill="#C6CDDB">contains_pii</text>
      <text x="268" y="146" fill="#E6E9EF">0.95 &gt; 0.60</text>
      <text x="400" y="146" fill="#FBBF24">high</text>
    </g>
  </g>

  <!-- side facts -->
  <g class="sans" transform="translate(760 386)">
    <g>
      <text x="0" y="22" font-size="34" font-weight="700" fill="#34D399">0.95</text>
      <text x="0" y="46" font-size="15" fill="#8B94A7">F1 on prompt injection, measured</text>
    </g>
    <g transform="translate(0 74)">
      <text x="0" y="22" font-size="34" font-weight="700" fill="#A78BFA">6</text>
      <text x="0" y="46" font-size="15" fill="#8B94A7">policies in readable YAML</text>
    </g>
    <g transform="translate(0 158)">
      <circle cx="6" cy="-5" r="5" fill="#34D399"/>
      <text x="20" y="0" font-size="15" fill="#8B94A7">Runs fully offline — no API key</text>
    </g>
  </g>

  <!-- footer -->
  <g class="sans" font-size="19">
    <text x="88" y="600" fill="#6F7A8F">github.com/rudra72r/jev-guard</text>
    <text x="1192" y="600" fill="#6F7A8F" text-anchor="end">MIT · Python 3.10+</text>
  </g>
  <rect x="88" y="576" width="52" height="3" rx="1.5" fill="#8B5CF6" opacity=".8"/>
</svg>
