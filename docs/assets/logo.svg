<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="jev-guard">
  <title>jev-guard</title>
  <!-- Three measured values against one threshold line: the whole product in a glyph.
       Two cross it, one doesn't. -->
  <rect x="0" y="0" width="64" height="64" fill="#FFFFFF"/>
  <rect x=".75" y=".75" width="62.5" height="62.5" fill="none" stroke="#12120F" stroke-width="1.5"/>

  <g>
    <rect x="12" y="17" width="34" height="6" fill="#C82828"/>
    <rect x="12" y="29" width="30" height="6" fill="#B07000"/>
    <rect x="12" y="41" width="13" height="6" fill="#12120F" opacity=".38"/>
  </g>

  <!-- threshold -->
  <line x1="37.5" y1="11" x2="37.5" y2="53" stroke="#12120F" stroke-width="1.5"/>
</svg>
