name: Bug report
description: Something in jev-guard doesn't work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Security bugs (anything that lets content bypass a check or leaks data) go through SECURITY.md, not here.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Code or CLI command. Synthetic data only; never paste an API key.
      render: python
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error output
      description: Run CLI commands with `--debug` for the full traceback.
      render: text
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "jev-guard 0.1.0, typesafe-sdk 0.7.1, Python 3.12, OS"
    validations:
      required: true
