name: Release

# Runs when a version tag is pushed (e.g. v0.1.0). Builds the wheel and sdist, checks them,
# and attaches them to a GitHub Release, so `pip install` from a release URL is reproducible.
#
# Not publishing to PyPI yet. To add it later:
#   1. Register a trusted publisher at https://pypi.org/manage/account/publishing/
#      (owner rudra72r, repo jev-guard, workflow release.yml, environment pypi).
#   2. Create the `pypi` environment in Settings -> Environments, with yourself as a
#      required reviewer.
#   3. Uncomment the `pypi` job below and flip ON_PYPI in src/jev_guard/_install.py.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install hatch twine
      - name: Check the tag matches the package version
        run: |
          version=$(hatch version)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi
      - run: hatch build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release and upload the built files to it
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes "Install this release:

          \`\`\`
          pip install \"jev-guard[local] @ git+https://github.com/rudra72r/jev-guard@$GITHUB_REF_NAME\"
          \`\`\`

          See CHANGELOG.md for what's in it."

