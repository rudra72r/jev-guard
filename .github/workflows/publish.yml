name: Publish to PyPI

# Runs when a version tag is pushed (e.g. v0.1.0). The upload waits for manual approval:
# in GitHub, Settings -> Environments -> "pypi", add yourself as a required reviewer.
# Uses PyPI trusted publishing, so no API token is stored in the repo. Configure it at
# https://pypi.org/manage/account/publishing/ (owner rudra72r, repo jev-guard,
# workflow publish.yml, environment pypi).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install hatch twine
      - name: Check the tag matches the package version
        run: |
          version=$(hatch version)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi
      - run: hatch build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/jev-guard/
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
